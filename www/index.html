<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>JADWALMU</title>
<style>
:root {
  --bg-light: #f4f7f6; --bg-dark: #0f0f11;
  --panel-light: #ffffff; --panel-dark: #1c1c1e;
  --text-light: #2d2d2d; --text-dark: #f2f2f7;
  --primary: #ff9500;
  --primary-glow: rgba(255, 149, 0, 0.2);
  --border-light: #e5e5ea; --border-dark: #38383a;
  --bg: var(--bg-light); --panel: var(--panel-light); --text: var(--text-light); --border: var(--border-light); --input-bg: #ffffff;
}
body.dark-mode {
  --bg: var(--bg-dark); --panel: var(--panel-dark); --text: var(--text-dark); --border: var(--border-dark); --input-bg: #2c2c2e;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; min-height: 100vh; padding-bottom: 90px; overflow-x: hidden; }
.hidden { display: none !important; }

/* AUTH */
#authView { display: flex; flex-direction: column; justify-content: center; height: 100vh; padding: 30px; background: var(--bg); }
.logo-title { text-align: center; margin-bottom: 35px; font-size: 32px; font-weight: 900; letter-spacing: 2px; color: var(--primary); text-shadow: 0 4px 15px var(--primary-glow); }
.tabs { display: flex; background: var(--panel); border-radius: 15px; padding: 6px; margin-bottom: 25px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); }
.tabs button { flex: 1; background: transparent; border: 0; color: var(--text); padding: 12px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: 0.3s; }
.tabs button.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px var(--primary-glow); }
.input-group { margin-bottom: 18px; }
.input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; margin-left: 5px; color: var(--text); opacity: 0.7; }
input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="time"] { width: 100%; background: var(--input-bg); border: 2px solid transparent; color: var(--text); padding: 16px; border-radius: 14px; font-size: 15px; outline: none; transition: 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
input:focus { border-color: var(--primary); box-shadow: 0 4px 12px var(--primary-glow); }
.btn-primary { width: 100%; background: var(--primary); color: #fff; border: 0; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; margin-top: 10px; cursor: pointer; box-shadow: 0 6px 20px var(--primary-glow); transition: 0.2s; }
.btn-primary:active { transform: scale(0.97); }
.btn-secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 14px; border-radius: 14px; width: 100%; margin-top: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }

/* HEADER */
.app-header { padding: 20px 25px; display: flex; align-items: center; gap: 15px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); }
.app-logo { width: 38px; height: 38px; filter: drop-shadow(0 4px 6px var(--primary-glow)); }
.app-title { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }

/* CONTENT */
.view-section { padding: 20px 25px; display: none; animation: fadeIn 0.4s ease; }
.view-section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* KALENDER */
.calendar-container { background: var(--panel); padding: 20px; border-radius: 24px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 18px; font-weight: 800; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
.cal-day { font-size: 12px; font-weight: 600; opacity: 0.5; margin-bottom: 8px; }
.cal-date { padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 600; }
.cal-date.today { background: var(--primary); color: #fff; box-shadow: 0 4px 12px var(--primary-glow); }

/* JADWAL CARD */
.schedule-card { background: var(--panel); padding: 20px; border-radius: 20px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.04); position: relative; overflow: hidden; border-left: 4px solid var(--primary); animation: slideUp 0.3s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.schedule-info h4 { font-size: 17px; margin-bottom: 6px; font-weight: 700; }
.schedule-info p { font-size: 13px; opacity: 0.6; font-weight: 500; }
.countdown { background: var(--primary-glow); color: var(--primary); padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 800; margin-bottom: 15px; text-align: center; }
.card-actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn-icon { width: 40px; height: 40px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
.btn-icon svg { width: 20px; height: 20px; fill: currentColor; }
.btn-icon.delete { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }
.btn-icon.cancel { background: rgba(142, 142, 147, 0.1); color: #8e8e93; }
.btn-icon:active { transform: scale(0.9); }

/* BOTTOM NAV */
.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0 20px 0; z-index: 100; border-radius: 25px 25px 0 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.05); }
.nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text); opacity: 0.4; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.3s; }
.nav-item.active { opacity: 1; color: var(--primary); transform: translateY(-2px); }
.nav-item svg { width: 26px; height: 26px; margin-bottom: 4px; fill: currentColor; }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: 0.3s; }
.modal-overlay:not(.hidden) { opacity: 1; pointer-events: auto; }
.modal-content { background: var(--panel); width: 100%; max-width: 400px; border-radius: 28px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.9); transition: 0.3s; }
.modal-overlay:not(.hidden) .modal-content { transform: scale(1); }
.modal-content h3 { margin-bottom: 25px; text-align: center; font-size: 20px; font-weight: 800; }

/* SETTINGS */
.setting-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--border); }
.setting-item:last-child { border-bottom: none; }
.switch { position: relative; display: inline-block; width: 52px; height: 30px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
input:checked + .slider { background-color: var(--primary); }
input:checked + .slider:before { transform: translateX(22px); }

/* PROFILE */
.profile-header { text-align: center; padding: 20px 0; }
.profile-pic { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid var(--panel); outline: 3px solid var(--primary); background: #ddd; margin-bottom: 15px; transition: 0.3s; }
.profile-pic:hover { transform: scale(1.05); }
</style>
</head>
<body>
  <div id="notifPermission" class="modal-overlay hidden">
  <div class="modal-content" style="text-align:center;">
    <h3>Izinkan Notifikasi</h3>
    <p style="font-size:14px; margin-bottom:25px; opacity:0.7; line-height:1.5;">Aplikasi ini butuh izin notifikasi agar bisa mengingatkan jadwal kamu tepat waktu.</p>
    <button class="btn-primary" onclick="requestNotif()">IZINKAN SEKARANG</button>
  </div>
</div>

<div id="authView">
  <div class="logo-title">JADWALMU</div>
  <div class="tabs">
    <button id="tabLogin" class="active">Masuk</button>
    <button id="tabRegister">Daftar</button>
  </div>
  <div id="loginForm">
    <div class="input-group"><label>Email</label><input type="email" id="loginEmail" placeholder="email@contoh.com"></div>
    <div class="input-group"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••"></div>
    <button class="btn-primary" onclick="doLogin()">MASUK</button>
  </div>
  <div id="registerForm" class="hidden">
    <div class="input-group"><label>Username</label><input type="text" id="regUser" placeholder="Nama kamu"></div>
    <div class="input-group"><label>Email</label><input type="email" id="regEmail" placeholder="email@contoh.com"></div>
    <div class="input-group"><label>Password</label><input type="password" id="regPass" placeholder="Minimal 6 karakter"></div>
    <button class="btn-primary" onclick="doRegister()">DAFTAR AKUN</button>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="app-header">
    <svg class="app-logo" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><circle cx="12" cy="15" r="1"></circle><circle cx="16" cy="15" r="1"></circle><circle cx="8" cy="15" r="1"></circle></svg>
    <div class="app-title">JADWALMU</div>
  </div>

  <div id="viewJadwal" class="view-section active">
    <div class="calendar-container">
      <div class="calendar-header"><span id="monthYear"></span></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <button class="btn-primary" onclick="openAddModal()" style="margin-bottom: 25px;">+ Tambah Jadwal Baru</button>
    <div id="scheduleList"></div>
  </div>

  <div id="viewSetting" class="view-section">
    <h3 style="margin-bottom: 20px; font-weight:800;">Pengaturan</h3>
    <div class="setting-item">
      <div><h4 style="font-weight:700;">Mode Gelap</h4><p style="font-size:12px; opacity:0.6;">Ubah tema aplikasi</p></div>
      <label class="switch"><input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()"><span class="slider"></span></label>
    </div>
    <div class="setting-item">
      <div><h4 style="font-weight:700;">Suara Notifikasi</h4><p style="font-size:12px; opacity:0.6;">Upload MP3 kustom</p></div>
      <input type="file" accept="audio/*" id="audioUpload" style="display:none;" onchange="handleAudioUpload(event)">
      <button class="btn-secondary" style="width:auto; padding:8px 16px; margin:0; border-radius:10px;" onclick="document.getElementById('audioUpload').click()">Pilih File</button>
    </div>
  </div>

  <div id="viewAkun" class="view-section">
    <div class="profile-header">
      <input type="file" accept="image/*" id="picUpload" style="display:none;" onchange="handlePicUpload(event)">
      <img src="https://via.placeholder.com/150" class="profile-pic" id="profilePic" onclick="document.getElementById('picUpload').click()">
      <h3 style="font-weight:800; font-size:20px;" id="profileUsername"></h3>
      <p style="font-size:13px; opacity:0.6; margin-top:5px;" id="profileEmail"></p>
    </div>
    <div class="input-group" style="margin-top:20px;"><label>Ubah Username</label><input type="text" id="editUser"></div>
    <div class="input-group"><label>Ubah Email</label><input type="email" id="editEmail"></div>
    <div class="input-group"><label>Ubah Password</label><input type="password" id="editPass" placeholder="Biarkan kosong jika tidak diubah"></div>
    <button class="btn-primary" onclick="saveProfile()">Simpan Perubahan</button>
    <button class="btn-secondary" onclick="doLogout()" style="border-color: #ff3b30; color: #ff3b30; margin-top: 25px;">LOG OUT</button>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="navJadwal" onclick="switchView('Jadwal')">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
      JADWAL
    </div>
    <div class="nav-item" id="navSetting" onclick="switchView('Setting')">
      <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
      SETTING
    </div>
    <div class="nav-item" id="navAkun" onclick="switchView('Akun')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      AKUN
    </div>
  </div>
</div>

<div id="addModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>Tambah Jadwal</h3>
    <div class="input-group"><label>Nama Acara</label><input type="text" id="eventName" placeholder="Contoh: Main Game"></div>
    <div class="input-group"><label>Tanggal</label><input type="date" id="eventDate"></div>
    <div class="input-group"><label>Jam</label><input type="time" id="eventTime"></div>
    <button class="btn-primary" onclick="saveSchedule()">SIMPAN JADWAL</button>
    <button class="btn-secondary" onclick="closeAddModal()" style="border:none; color:var(--text); opacity:0.6; margin-top:15px;">Batal</button>
  </div>
</div>
<script>
  let user = JSON.parse(localStorage.getItem('jm_user')) || null;
let schedules = JSON.parse(localStorage.getItem('jm_schedules')) || [];
let isDarkMode = localStorage.getItem('jm_dark') === 'true';
let isCordovaReady = false;

// PENTING: Tunggu HP siap sebelum panggil notifikasi
document.addEventListener('deviceready', function () {
    isCordovaReady = true;
}, false);

window.onload = () => {
  if (isDarkMode) { document.body.classList.add('dark-mode'); document.getElementById('darkModeToggle').checked = true; }
  if (!user) {
    document.getElementById('authView').classList.remove('hidden');
    document.getElementById('appView').classList.add('hidden');
    setTimeout(() => { document.getElementById('notifPermission').classList.remove('hidden'); }, 800);
  } else { loadApp(); }
};

function requestNotif() {
  if (window.cordova && cordova.plugins && cordova.plugins.notification) {
    cordova.plugins.notification.local.requestPermission(function (granted) {
      document.getElementById('notifPermission').classList.add('hidden');
    });
  } else if ("Notification" in window) {
    Notification.requestPermission().then(() => { document.getElementById('notifPermission').classList.add('hidden'); }); 
  } else {
    document.getElementById('notifPermission').classList.add('hidden');
  }
}

document.getElementById('tabLogin').onclick = () => {
  document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegister').classList.remove('active');
  document.getElementById('loginForm').classList.remove('hidden'); document.getElementById('registerForm').classList.add('hidden');
};
document.getElementById('tabRegister').onclick = () => {
  document.getElementById('tabRegister').classList.add('active'); document.getElementById('tabLogin').classList.remove('active');
  document.getElementById('registerForm').classList.remove('hidden'); document.getElementById('loginForm').classList.add('hidden');
};

function doRegister() {
  const u = document.getElementById('regUser').value;
  const e = document.getElementById('regEmail').value;
  const p = document.getElementById('regPass').value;
  if(!u || !e || !p) return alert('Isi semua kolom!');
  user = { username: u, email: e, password: p, profilePic: 'https://via.placeholder.com/150' };
  localStorage.setItem('jm_user', JSON.stringify(user));
  alert('Daftar berhasil! Silakan login.'); document.getElementById('tabLogin').click();
}
function doLogin() {
  const e = document.getElementById('loginEmail').value; const p = document.getElementById('loginPass').value;
  if(!user) return alert('Belum ada akun, silakan daftar dulu.');
  if(e === user.email && p === user.password) { loadApp(); } else { alert('Email atau Password salah!'); }
}
function doLogout() { localStorage.removeItem('jm_user'); location.reload(); }
function loadApp() {
  document.getElementById('authView').classList.add('hidden'); document.getElementById('appView').classList.remove('hidden');
  document.getElementById('profileUsername').innerText = user.username; document.getElementById('profileEmail').innerText = user.email;
  document.getElementById('profilePic').src = user.profilePic;
  document.getElementById('editUser').value = user.username; document.getElementById('editEmail').value = user.email;
  renderCalendar(); renderSchedules();
}
function switchView(view) {
  document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('view' + view).classList.add('active'); document.getElementById('nav' + view).classList.add('active');
}

let currentDate = new Date();
function renderCalendar() {
  const monthYear = document.getElementById('monthYear'); const grid = document.getElementById('calendarGrid');
  const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  monthYear.innerText = `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
  grid.innerHTML = '';
  ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].forEach(d => { grid.innerHTML += `<div class="cal-day">${d}</div>`; });
  const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
  const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
  for(let i=0; i<firstDay; i++) { grid.innerHTML += `<div></div>`; }
  for(let i=1; i<=daysInMonth; i++) {
    const today = new Date();
    const isToday = i === today.getDate() && currentDate.getMonth() === today.getMonth() && currentDate.getFullYear() === today.getFullYear();
    grid.innerHTML += `<div class="cal-date ${isToday ? 'today' : ''}">${i}</div>`;
  }
}

function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

function saveSchedule() {
  const name = document.getElementById('eventName').value; 
  const date = document.getElementById('eventDate').value; 
  const time = document.getElementById('eventTime').value;
  if(!name || !date || !time) return alert('Lengkapi semua data!');
  
  const timestamp = new Date(`${date}T${time}`).getTime();
  const id = Date.now();
  
  schedules.push({ id, name, timestamp, active: true });
  localStorage.setItem('jm_schedules', JSON.stringify(schedules));
  
  // Jadwalin Notifikasi (Cek dulu apakah HP support)
  if (window.cordova && isCordovaReady) {
    cordova.plugins.notification.local.schedule({
      id: id,
      title: 'JADWALMU: ' + name,
      text: 'Acara kamu sudah dimulai!',
      trigger: { at: new Date(timestamp) },
      foreground: true,
      vibrate: true
    });
  }

  closeAddModal(); 
  renderSchedules();
}

function deleteSchedule(id) {
  if(!confirm('Hapus jadwal ini?')) return;
  schedules = schedules.filter(s => s.id !== id);
  localStorage.setItem('jm_schedules', JSON.stringify(schedules));
  
  if (window.cordova && isCordovaReady) {
    cordova.plugins.notification.local.cancel(id);
  }
  renderSchedules();
}

function cancelNotif(id) {
  if(!confirm('Matikan alarm untuk jadwal ini?')) return;
  schedules = schedules.map(s => { if(s.id === id) s.active = false; return s; });
  localStorage.setItem('jm_schedules', JSON.stringify(schedules));
  
  if (window.cordova && isCordovaReady) {
    cordova.plugins.notification.local.cancel(id);
  }
  renderSchedules();
  alert('Alarm dimatikan (Jadwal tidak dihapus).');
}

function renderSchedules() {
  const list = document.getElementById('scheduleList'); list.innerHTML = '';
  if(schedules.length === 0) { list.innerHTML = '<p style="text-align:center; opacity:0.5; font-size:14px; padding:20px;">Belum ada jadwal.</p>'; return; }
  
  schedules.sort((a,b) => a.timestamp - b.timestamp);
  
  schedules.forEach(s => {
    const d = new Date(s.timestamp);
    const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    
    let actionButtons = '';
    if (s.active !== false) {
      actionButtons = `
        <div class="card-actions">
          <button class="btn-icon cancel" onclick="cancelNotif(${s.id})" title="Matikan Alarm">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
          <button class="btn-icon delete" onclick="deleteSchedule(${s.id})" title="Hapus Jadwal">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </div>`;
    } else {
      actionButtons = `<div style="color:#ff3b30; font-weight:bold; font-size:12px; text-align:right; margin-top:10px;">ALARM MATI</div>`;
    }

    list.innerHTML += `
      <div class="schedule-card" style="flex-direction: column; align-items: stretch;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div class="schedule-info">
            <h4>${s.name}</h4>
            <p>${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} - ${timeStr}</p>
          </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:15px;">
           <div class="countdown" id="cd-${s.id}">...</div>
           ${actionButtons}
        </div>
      </div>`;
  });
  updateCountdowns();
}

setInterval(updateCountdowns, 1000);
function updateCountdowns() {
  schedules.forEach(s => {
    const el = document.getElementById(`cd-${s.id}`); if(!el) return;
    const diff = s.timestamp - Date.now();
    if (diff <= 0) { 
      el.innerText = "WAKTUNYA!"; 
      if(s.active !== false) {
        el.style.background = "#ff3b30"; el.style.color = "#fff"; 
      }
    } else {
      if(s.active !== false) {
        el.innerText = `${Math.floor(diff/86400000)}h ${Math.floor((diff%86400000)/3600000)}j ${Math.floor((diff%3600000)/60000)}m ${Math.floor((diff%60000)/1000)}s`;
      }
    }
  });
}

function toggleDarkMode() {
  if (document.getElementById('darkModeToggle').checked) { document.body.classList.add('dark-mode'); localStorage.setItem('jm_dark', 'true'); } 
  else { document.body.classList.remove('dark-mode'); localStorage.setItem('jm_dark', 'false'); }
}
function handleAudioUpload(e) { if(e.target.files[0]) alert('Suara diatur: ' + e.target.files[0].name); }
function handlePicUpload(e) {
  const file = e.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = function(event) { user.profilePic = event.target.result; document.getElementById('profilePic').src = user.profilePic; localStorage.setItem('jm_user', JSON.stringify(user)); };
    reader.readAsDataURL(file);
  }
}
function saveProfile() {
  user.username = document.getElementById('editUser').value; user.email = document.getElementById('editEmail').value;
  const newPass = document.getElementById('editPass').value; if(newPass) user.password = newPass;
  localStorage.setItem('jm_user', JSON.stringify(user)); alert('Profil diperbarui!'); loadApp();
}
</script>
